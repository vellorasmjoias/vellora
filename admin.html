<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Área da loja · Vellora</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:760px;margin:0 auto;padding:30px 5vw 80px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;margin-top:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:34px}
.login{max-width:380px;margin:12vh auto 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .th{width:52px;height:52px;background:var(--blush);flex:none;overflow:hidden;border-radius:8px}.item .th img{width:100%;height:100%;object-fit:cover}
.item .th video{width:100%;height:100%;object-fit:cover}
.item .n{flex:1;min-width:0}.item b{font-weight:400}
.msg{font-size:13px;margin-top:10px;color:var(--muted)}.msg.bad{color:#c0564a}
.tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.tabb{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 20px;border-radius:99px;font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.tabb.on{background:var(--gold);color:#fff;border-color:var(--gold)}
[data-t]{display:none}[data-t].on{display:block}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px 18px;margin-top:14px}
.rt{display:grid;grid-template-columns:30px 90px 1fr;gap:6px;align-items:center}.rt input{padding:8px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const root=$('#root');
if(!CFG.url||CFG.url.startsWith('COLE')){root.innerHTML='<div class="box">Configure o arquivo <b>config.js</b> primeiro.</div>';throw 0}
const db=supabase.createClient(CFG.url,CFG.key);
const ST={aguardando:'Aguardando pagamento',pago:'Pago',enviado:'Enviado',cancelado:'Cancelado'};
let tab='entregas',RVW=[],R=[],O=[],CV={},P=[],S={},edit=null,file=null;

function note(t,bad){const m=$('#msg');if(m){m.textContent=t;m.className='msg'+(bad?' bad':'')}}

function loginView(){
  root.innerHTML=`<div class="box login"><h1 style="margin:0 0 4px;font-size:34px">Área da loja</h1><p class="hint" style="margin:0">Acesso restrito.</p>
  <label>E-mail</label><input id="em" type="email" autocomplete="username">
  <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="btn" id="go" style="width:100%">Entrar</button></p><div id="msg" class="msg"></div></div>`;
  const go=async()=>{note('Entrando…');
    const {error}=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error){const m=error.message||'';
      note(/invalid login/i.test(m)?'E-mail ou senha incorretos (ou usuário não confirmado). Detalhe: '+m
        :/not confirmed/i.test(m)?'E-mail ainda não confirmado: no Supabase, abra o usuário e confirme-o.'
        :/api key|apikey|jwt|fetch|network/i.test(m)?'Problema com o config.js (URL ou chave). Detalhe: '+m
        :'Erro: '+m,1)}else panel()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}

async function panel(){
  const ad=await db.rpc('is_admin');
  if(ad.error||!ad.data){root.innerHTML='<div class="box login"><h1 style="margin:0 0 6px;font-size:30px">Acesso negado</h1><p class="hint">Esta conta não é a da dona da loja.</p><p><button class="btn" id="out2">Sair</button></p></div>';$('#out2').onclick=async()=>{await db.auth.signOut();loginView()};return}
  const [p,s,c,od,sr,rw]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:false}),db.from('settings').select('*').eq('id',1).maybeSingle(),db.from('categories').select('*'),db.from('orders').select('*').order('created_at',{ascending:false}).limit(200),db.from('shipping_rates').select('*').order('uf'),db.from('reviews').select('*').order('created_at',{ascending:false}).limit(300)]);
  O=od.data||[];R=sr.data||[];RVW=rw.data||[];
  CV={};(c.data||[]).forEach(x=>CV[x.name]=x.video_url);
  P=p.data||[];S=s.data||{id:1,store_name:'Vellora',tagline:'',whatsapp:''};
  if(edit){formView();return}
  const toShip=O.filter(o=>o.status==='pago'),sent=O.filter(o=>o.status==='enviado').slice(0,10);
  const addr=o=>{const x=o.address||{};return o.ship_method==='retirada'?'Retirada na loja':[x.street&&(x.street+', '+x.num+(x.comp?' - '+x.comp:'')),x.bairro,x.city,o.ship_cep&&('CEP '+o.ship_cep)].filter(Boolean).map(esc).join(' · ')};
  const wa=o=>{const d=(o.customer_phone||'').replace(/\D/g,'');return d.length<=11?'55'+d:d};
  const dcard=(o,done)=>`<div class="item" style="align-items:flex-start;flex-wrap:wrap"><div class="n" style="min-width:230px"><b>#${o.number} · ${esc(o.customer_name||o.user_email)}</b>
    <div class="hint">${o.ship_method==='retirada'?'Retirada':'Entrega'} · pago ${o.paid_at?new Date(o.paid_at).toLocaleDateString('pt-BR'):''} · ${brl(o.total)} (frete ${Number(o.ship_price)?brl(o.ship_price):'grátis'})</div>
    <div class="hint">${addr(o)}</div><div class="hint">${(o.items||[]).map(i=>i.qty+'x '+esc(i.name)).join(', ')}</div>
    ${o.customer_phone?`<div class="hint">WhatsApp: <a href="https://wa.me/${wa(o)}" target="_blank" rel="noopener" style="color:var(--gold)">${esc(o.customer_phone)}</a></div>`:''}
    ${done&&o.tracking?`<div class="hint">Rastreio: <b>${esc(o.tracking)}</b></div>`:''}</div>
    ${done?'':`<div style="display:flex;flex-direction:column;gap:6px;min-width:150px">${o.ship_method==='retirada'?'':`<input data-tr="${o.id}" placeholder="Código de rastreio" style="padding:8px">`}
    <button class="btn sm" data-ship="${o.id}">${o.ship_method==='retirada'?'Marcar entregue':'Marcar enviado'}</button><button class="btn sm ghost" data-copy="${o.id}">Copiar endereço</button></div>`}</div>`;
  const ENT=`<div data-t="entregas" class="${tab==='entregas'?'on':''}"><div class="box"><h3 style="margin:0;font-size:26px">A enviar (${toShip.length})</h3>
    <p class="hint" style="margin:4px 0 0">Pedidos já pagos, prontos para embalar e enviar. Cole o código de rastreio e marque como enviado.</p>
    ${toShip.map(o=>dcard(o,false)).join('')||'<p class="hint">Nenhum pedido pago aguardando envio ✦</p>'}</div>
    ${sent.length?`<div class="box"><h3 style="margin:0;font-size:22px">Enviados recentemente</h3>${sent.map(o=>dcard(o,true)).join('')}</div>`:''}</div>`;
  const ELG=`<div data-t="elogios" class="${tab==='elogios'?'on':''}"><div class="box"><h3 style="margin:0;font-size:26px">Elogios (${RVW.length})</h3>
    <p class="hint" style="margin:4px 0 0">Aparecem no site assim que são enviados. Apague os que forem ofensivos ou indevidos.</p>
    ${RVW.map(r=>`<div class="item" style="align-items:flex-start"><div class="n"><b>${esc(r.author)}</b> <span style="color:var(--gold)">${'★'.repeat(r.stars)}</span>${r.verified?' <span class="hint">· compra verificada</span>':''}
    <div class="hint">${new Date(r.created_at).toLocaleString('pt-BR')}</div><div style="margin-top:4px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere">${esc(r.body)}</div></div>
    <button class="btn sm danger" data-rdel="${r.id}">Apagar</button></div>`).join('')||'<p class="hint">Nenhum elogio ainda.</p>'}</div></div>`;
  const TABS=`<div class="tabs">${[['entregas','Entregas ('+toShip.length+')'],['pedidos','Pedidos ('+O.length+')'],['elogios','Elogios ('+RVW.length+')'],['loja','Loja']].map(([k,l])=>`<button class="tabb ${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>`;
  const FRETE=`<div class="box"><h3 style="margin:0;font-size:26px">Frete</h3>
    <p class="hint" style="margin:4px 0 0">Valor fixo por estado, calculado pelo CEP da cliente. <b>Revise os valores iniciais</b> e ajuste ao que você paga de envio.</p>
    <div class="row2"><div><label>Frete grátis a partir de (R$ · 0 = desligado)</label><input id="fg" type="number" step="0.01" min="0" value="${S.free_ship_from||0}"></div>
    <div><label>Retirada (texto · vazio = desligada)</label><input id="fpk" value="${esc(S.pickup_text)}" placeholder="Ex.: Retirar em Bauru, combinar pelo WhatsApp"></div></div>
    <div class="rates">${R.map(r=>`<div class="rt"><b>${esc(r.uf)}</b><input data-rp="${r.uf}" type="number" step="0.01" min="0" value="${r.price}"><input data-rd="${r.uf}" value="${esc(r.days)}" placeholder="prazo"></div>`).join('')||'<p class="hint">Rode o setup.sql para criar a tabela de frete.</p>'}</div>
    <p><button class="btn sm" id="sr">Salvar frete</button> <span class="hint" id="msgf"></span></p></div>
  `;
  root.innerHTML=`<div class="top"><h1>Área da loja</h1><div><a class="btn sm ghost" href="index.html" target="_blank">Ver catálogo</a> <button class="btn sm ghost" id="out">Sair</button></div></div>
  ${TABS}${ENT}${ELG}<div data-t="pedidos" class="${tab==='pedidos'?'on':''}"><div class="box"><h3 style="margin:0;font-size:26px">Pedidos (${O.length})</h3>
  <p class="hint" style="margin:4px 0 0">Confira o Pix no app do seu banco e depois marque o pedido como pago.</p>
  ${O.map(o=>`<div class="item" style="align-items:flex-start"><div class="n"><b>#${o.number} · ${brl(o.total)}</b>
  <div class="hint">${new Date(o.created_at).toLocaleString('pt-BR')} · ${esc(o.user_email)}</div>
  <div class="hint">${(o.items||[]).map(i=>i.qty+'x '+esc(i.name)).join(', ')}</div><div class="hint"><b>${ST[o.status]}</b></div></div>
  <div style="display:flex;flex-direction:column;gap:6px">${o.status==='aguardando'?`<button class="btn sm" data-os="${o.id}:pago">Marcar pago</button>`:''}${o.status==='pago'?'<span class="hint">Veja na aba Entregas</span>':''}${['aguardando','pago'].includes(o.status)?`<button class="btn sm danger" data-os="${o.id}:cancelado">Cancelar</button>`:''}</div></div>`).join('')||'<p class="hint">Nenhum pedido ainda.</p>'}
  </div></div>
  <div data-t="loja" class="${tab==='loja'?'on':''}"><div class="box"><h3 style="margin:0;font-size:26px">Dados da loja</h3>
  <label>Nome da loja</label><input id="sn" value="${esc(S.store_name)}">
  <label>Frase de destaque</label><input id="st" value="${esc(S.tagline)}">
  <label>WhatsApp (com DDD, ex.: 11999998888)</label><input id="sw" value="${esc(S.whatsapp)}">
  <label>Parcelas sem juros (ex.: 5 · use 1 para não mostrar)</label><input id="si" type="number" min="1" max="12" value="${S.installments||5}">
  <label>Chave Pix (CPF/CNPJ só números · celular +5511999998888 · e-mail · ou chave aleatória)</label><input id="pk" value="${esc(S.pix_key)}">
  <div class="row2"><div><label>Nome do recebedor (como no banco)</label><input id="pn" value="${esc(S.pix_name)}" maxlength="25"></div>
  <div><label>Cidade</label><input id="pc" value="${esc(S.pix_city)}" maxlength="15"></div></div>
  <p><button class="btn sm" id="ss">Salvar dados</button></p></div>
  ${FRETE}<div class="box"><h3 style="margin:0;font-size:26px">Vídeos das categorias</h3>
  <p class="hint" style="margin:4px 0 0">Vídeo curto (até 50 MB) que passa atrás do nome da categoria no site. Sem vídeo, aparece a foto de uma peça.</p>
  ${[...new Set(P.map(p=>p.category).filter(Boolean))].map(c=>`<div class="item"><div class="th">${CV[c]?`<video src="${esc(CV[c])}" muted playsinline preload="metadata"></video>`:''}</div>
  <div class="n"><b>${esc(c)}</b><div class="hint">${CV[c]?'Vídeo definido':'Sem vídeo'}</div></div>
  <label class="btn sm ghost" style="margin:0">${CV[c]?'Trocar vídeo':'Enviar vídeo'}<input type="file" accept="video/*" hidden data-v="${esc(c)}"></label>${CV[c]?`<button class="btn sm danger" data-rv="${esc(c)}">Remover</button>`:''}</div>`).join('')||'<p class="hint">Cadastre peças com categoria primeiro.</p>'}
  <div id="msgc" class="msg"></div></div>
  <div class="box"><div class="top"><h3 style="margin:0;font-size:26px">Peças (${P.length})</h3><button class="btn sm" id="add">+ Nova peça</button></div>
  ${P.map(p=>`<div class="item"><div class="th">${p.image_url?`<img src="${esc(p.image_url)}">`:''}</div>
  <div class="n"><b>${esc(p.name)}</b><div class="hint">${esc(p.category)} · ${brl(p.price)}${p.sold_out?' · esgotado':''}</div></div>
  <button class="btn sm ghost" data-e="${p.id}">Editar</button><button class="btn sm danger" data-d="${p.id}">Excluir</button></div>`).join('')||'<p class="hint">Nenhuma peça cadastrada ainda.</p>'}
  <div id="msg" class="msg"></div></div></div>`;
  $('#out').onclick=async()=>{await db.auth.signOut();loginView()};
  $('#ss').onclick=async()=>{const {error}=await db.from('settings').upsert({id:1,store_name:$('#sn').value.trim()||'Vellora',tagline:$('#st').value.trim(),whatsapp:$('#sw').value.trim(),installments:parseInt($('#si').value)||5,pix_key:$('#pk').value.trim().replace(/\s/g,''),pix_name:$('#pn').value.trim(),pix_city:$('#pc').value.trim()});
    note(error?'Erro ao salvar.':'Dados salvos ✓',!!error)};
  $('#add').onclick=()=>{edit={};file=null;formView()};
  root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{edit={...P.find(p=>p.id===b.dataset.e)};file=null;formView()});
  root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>del(b.dataset.d));
  root.querySelectorAll('[data-os]').forEach(b=>b.onclick=async()=>{const [id,st]=b.dataset.os.split(':');if(st==='cancelado'&&!confirm('Cancelar este pedido?'))return;const r=await db.from('orders').update(st==='pago'?{status:st,paid_at:new Date().toISOString()}:{status:st}).eq('id',id);if(r.error){alert('Erro ao atualizar o pedido.');return}panel()});
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;root.querySelectorAll('[data-t]').forEach(d=>d.classList.toggle('on',d.dataset.t===tab));root.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab))});
  root.querySelectorAll('[data-ship]').forEach(b=>b.onclick=async()=>{const id=b.dataset.ship,t=root.querySelector(`[data-tr="${id}"]`)?.value.trim()||null;
    const r=await db.from('orders').update({status:'enviado',tracking:t,shipped_at:new Date().toISOString()}).eq('id',id);
    if(r.error){alert('Erro ao atualizar o pedido.');return}panel()});
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const o=O.find(x=>x.id===b.dataset.copy),x=o.address||{};
    const txt=[o.customer_name,x.street&&`${x.street}, ${x.num}${x.comp?' - '+x.comp:''}`,x.bairro,x.city,o.ship_cep&&'CEP '+o.ship_cep,o.customer_phone].filter(Boolean).join('\n');
    try{await navigator.clipboard.writeText(txt);b.textContent='Copiado ✓'}catch(e){prompt('Copie o endereço:',txt)}});
  root.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Apagar este elogio? Não dá para desfazer.'))return;const r=await db.from('reviews').delete().eq('id',b.dataset.rdel);if(r.error){alert('Erro ao apagar o elogio.');return}panel()});
  const srb=$('#sr');if(srb)srb.onclick=async()=>{
    const rows=R.map(r=>({uf:r.uf,price:parseFloat(root.querySelector(`[data-rp="${r.uf}"]`).value)||0,days:root.querySelector(`[data-rd="${r.uf}"]`).value.trim()}));
    const x=await db.from('shipping_rates').upsert(rows),y=await db.from('settings').upsert({id:1,free_ship_from:parseFloat($('#fg').value)||0,pickup_text:$('#fpk').value.trim()});
    $('#msgf').textContent=(x.error||y.error)?'Erro ao salvar.':'Frete salvo ✓'};
  root.querySelectorAll('[data-v]').forEach(i=>i.onchange=()=>upVideo(i.dataset.v,i.files[0]));
  root.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>rmVideo(b.dataset.rv));
}

function formView(){
  const p=edit;
  root.innerHTML=`<div class="top"><h1>${p.id?'Editar peça':'Nova peça'}</h1></div><div class="box">
  <label>Foto</label><input type="file" id="f" accept="image/*">
  <div id="prev" style="margin-top:8px">${p.image_url?`<img src="${esc(p.image_url)}" style="height:110px;border-radius:8px">`:''}</div>
  <label>Nome</label><input id="n" value="${esc(p.name)}">
  <div class="row2"><div><label>Preço (R$)</label><input id="pr" type="number" step="0.01" value="${p.price??''}"></div>
  <div><label>Preço antigo (opcional)</label><input id="po" type="number" step="0.01" value="${p.old_price??''}" placeholder="mostra o selo de desconto"></div></div>
  <div style="margin-top:0"><label>Categoria</label><input id="ct" list="cl" value="${esc(p.category)}" placeholder="Brincos, Colares…"><datalist id="cl">${[...new Set(P.map(x=>x.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <label>Descrição</label><textarea id="d" rows="4">${esc(p.description)}</textarea>
  <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="so" style="width:auto" ${p.sold_out?'checked':''}> Peça esgotada</label>
  <p><button class="btn" id="ok">Salvar peça</button> <button class="btn ghost" id="bk">Voltar</button></p><div id="msg" class="msg"></div></div>`;
  $('#f').onchange=async e=>{const f=e.target.files[0];if(!f)return;file=await shrink(f);$('#prev').innerHTML=`<img src="${URL.createObjectURL(file)}" style="height:110px;border-radius:8px">`};
  $('#bk').onclick=()=>{edit=null;panel()};
  $('#ok').onclick=save;
}

async function save(){
  const name=$('#n').value.trim();if(!name){note('Dê um nome à peça.',1);return}
  note('Salvando…');let url=edit.image_url||'';
  if(file){
    const path=crypto.randomUUID()+'.jpg';
    const up=await db.storage.from('produtos').upload(path,file,{contentType:'image/jpeg'});
    if(up.error){note('Erro ao enviar a foto.',1);return}
    if(url)await removeFile(url);
    url=db.storage.from('produtos').getPublicUrl(path).data.publicUrl;
  }
  const row={name,price:parseFloat($('#pr').value)||0,old_price:parseFloat($('#po').value)||null,category:$('#ct').value.trim()||'Outros',description:$('#d').value.trim(),image_url:url,sold_out:$('#so').checked};
  const r=edit.id?await db.from('products').update(row).eq('id',edit.id):await db.from('products').insert(row);
  if(r.error){note('Erro ao salvar a peça.',1);return}
  edit=null;file=null;panel();
}
async function del(id){
  if(!confirm('Excluir esta peça?'))return;
  const p=P.find(x=>x.id===id);
  const r=await db.from('products').delete().eq('id',id);
  if(r.error){note('Erro ao excluir.',1);return}
  if(p?.image_url)await removeFile(p.image_url);panel();
}
async function upVideo(cat,f){
  if(!f)return;const m=$('#msgc');
  if(f.size>50*1024*1024){m.textContent='Vídeo maior que 50 MB. Use um mais curto.';m.className='msg bad';return}
  m.textContent='Enviando vídeo… pode levar um pouco.';m.className='msg';
  const ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
  const path='cat-'+crypto.randomUUID()+'.'+ext;
  const up=await db.storage.from('produtos').upload(path,f,{contentType:f.type||'video/mp4'});
  if(up.error){m.textContent='Erro ao enviar: '+up.error.message;m.className='msg bad';return}
  const url=db.storage.from('produtos').getPublicUrl(path).data.publicUrl;
  const r=await db.from('categories').upsert({name:cat,video_url:url});
  if(r.error){m.textContent='Erro ao salvar: '+r.error.message;m.className='msg bad';return}
  if(CV[cat])await removeFile(CV[cat]);
  panel();
}
async function rmVideo(cat){
  if(!confirm('Remover o vídeo desta categoria?'))return;
  const u=CV[cat];await db.from('categories').delete().eq('name',cat);
  if(u)await removeFile(u);panel();
}
async function removeFile(url){const k=url.split('/produtos/')[1];if(k)await db.storage.from('produtos').remove([k])}

function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82)};im.src=r.result};r.readAsDataURL(f)})}
